<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TutorSync — Managed Tutor–Student Matching &amp; Academic Coordination</title>
  <meta name="description" content="Find verified home and online tutors free across India (CBSE, ICSE, WB, JEE/NEET). Transparent monthly billing and managed coordination." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="TutorSync — Verified Home &amp; Online Tutors (100% Free Registration)" />
  <meta property="og:description" content="Students &amp; Tutors join free. Personally verified matching, demo class option, and transparent monthly UPI billing." />
  <meta property="og:url" content="https://tvkfurniture-bit.github.io/TutorSyncV1.2/" />
  <meta property="og:image" content="https://tvkfurniture-bit.github.io/TutorSyncV1.2/preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-alt: #f1f5f9;
      --primary: #0f2942;
      --primary-hover: #173b5e;
      --accent: #0284c7;
      --accent-light: #e0f2fe;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --radius: 10px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.09);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }
    body {
      margin: 0; font-family: var(--font); color: var(--text);
      background: var(--bg); line-height: 1.55; font-size: 15px;
      -webkit-font-smoothing: antialiased; overflow-x: hidden; width: 100%;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3, h4 { margin: 0 0 0.5rem; color: var(--primary); font-weight: 700; line-height: 1.25; }
    p { margin: 0 0 1rem; color: var(--text-muted); }
    .hidden { display: none !important; }
    .container { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 1rem; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
      min-height: 40px; padding: 0.6rem 1.15rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      border: 1px solid transparent; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.15s;
      font-family: inherit; white-space: nowrap; text-decoration: none !important;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover:not(:disabled) { background: #0369a1; }
    .btn-wa { background: #16a34a; color: #fff; }
    .btn-wa:hover:not(:disabled) { background: #15803d; }
    .btn-outline { background: #fff; color: var(--primary); border-color: var(--border); }
    .btn-outline:hover:not(:disabled) { background: var(--surface); border-color: #cbd5e1; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { min-height: 34px; padding: 0.35rem 0.72rem; font-size: 0.82rem; border-radius: 6px; }
    .btn-block { width: 100%; }

    /* Cards & Badges */
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem; box-shadow: var(--shadow-sm); max-width: 100%;
    }
    .badge {
      display: inline-block; padding: 0.2rem 0.55rem; border-radius: 999px;
      font-size: 0.74rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em;
      background: var(--surface-alt); color: var(--text-muted); white-space: nowrap;
    }
    .badge-green { background: var(--success-bg); color: #166534; }
    .badge-amber { background: var(--warning-bg); color: #92400e; }
    .badge-red { background: var(--danger-bg); color: #991b1b; }
    .badge-blue { background: var(--accent-light); color: #075985; }

    /* Forms */
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; width: 100%; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.84rem; font-weight: 600; color: var(--primary); }
    .req::after { content: " *"; color: var(--danger); }
    input, select, textarea {
      width: 100%; min-height: 42px; padding: 0.58rem 0.75rem; border: 1px solid #cbd5e1;
      border-radius: 7px; font-family: inherit; font-size: 0.92rem; color: var(--text); background: #fff;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-light); border-color: var(--accent); }
    .chip-group { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .chip-label {
      display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.4rem 0.7rem;
      border: 1px solid var(--border); border-radius: 999px; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; background: var(--surface); user-select: none;
    }
    .chip-label input { width: auto; min-height: auto; margin: 0; }
    .help-text { font-size: 0.78rem; color: var(--text-muted); word-break: break-word; }

    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,0.96);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-bottom: 1px solid var(--border);
    }
    .nav-bar { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 0.5rem; }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.15rem; color: var(--primary); cursor: pointer; flex-shrink: 0; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: #fff;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .nav-links { display: flex; align-items: center; gap: 1rem; font-size: 0.88rem; font-weight: 500; }
    .nav-links a { color: var(--text-muted); }
    .nav-links a:hover { color: var(--primary); text-decoration: none; }
    .nav-actions { display: flex; align-items: center; gap: 0.45rem; }
    .mobile-menu-btn {
      display: none; background: none; border: 1px solid var(--border); border-radius: 6px;
      width: 38px; height: 38px; padding: 0; cursor: pointer; font-size: 1.2rem;
      align-items: center; justify-content: center; color: var(--primary);
    }

    /* Hero & Quick-Check */
    .hero {
      padding: 2.75rem 0 2.25rem;
      background-color: var(--surface);
      background-image: radial-gradient(#cbd5e1 0.9px, transparent 0.9px);
      background-size: 24px 24px;
      border-bottom: 1px solid var(--border);
    }
    .hero-grid { display: grid; grid-template-columns: 1.2fr 0.95fr; gap: 2rem; align-items: center; }
    .hero-pill {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.32rem 0.85rem; background: var(--accent-light); color: #0369a1;
      border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-bottom: 0.75rem;
    }
    .hero h1 { font-size: clamp(1.7rem, 4.5vw, 2.65rem); margin-bottom: 0.75rem; }
    .hero p { font-size: 1rem; margin-bottom: 1.15rem; }
    .hero-ctas { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; }
    .quick-check-box {
      background: #fff; border: 1px solid var(--border); border-top: 3px solid var(--accent);
      border-radius: 12px; padding: 1rem; box-shadow: var(--shadow-md); margin-bottom: 1rem;
    }
    .quick-check-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; align-items: end; }
    .quick-check-row .btn { grid-column: 1 / -1; min-height: 42px; }

    .einstein-quote {
      display: flex; align-items: flex-start; gap: 0.7rem;
      background: #fff; border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 8px; padding: 0.75rem 0.9rem; font-size: 0.84rem; color: var(--text-muted);
    }
    .chalkboard-card {
      background: var(--primary); color: #f8fafc; border-radius: 14px;
      border: 4px solid #1e3a5f; padding: 1.1rem; box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .chalkboard-card svg { max-width: 100%; height: auto; display: block; }
    .chalkboard-caption {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.35rem;
      margin-top: 0.75rem; padding-top: 0.65rem; border-top: 1px dashed rgba(226,232,240,0.25);
      font-size: 0.76rem; color: #cbd5e1;
    }

    /* Live Directory & Filter Pills */
    .live-pill { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.76rem; font-weight: 700; color: #166534; background: var(--success-bg); padding:0.2rem 0.6rem; border-radius: 999px; margin-bottom: 0.4rem; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulseDot 1.6s infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(1.25); } }
    .filter-pills {
      display: flex; gap: 0.4rem; overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 0.4rem; margin-bottom: 0.85rem; scrollbar-width: none;
    }
    .filter-pills::-webkit-scrollbar { display: none; }
    .filter-pill {
      border: 1px solid var(--border); background: #fff; color: var(--text-muted);
      padding: 0.32rem 0.75rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
      min-height: 32px;
    }
    .filter-pill.active, .filter-pill:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    .gallery-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .gallery-controls { display: flex; gap: 0.4rem; align-items: center; }
    .scroll-track {
      display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory;
      padding-bottom: 0.75rem; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;
      -webkit-overflow-scrolling: touch; width: 100%;
    }
    .scroll-track::-webkit-scrollbar { height: 6px; }
    .scroll-track::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }

    .edu-slide {
      flex: 0 0 min(300px, 82vw); scroll-snap-align: start;
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .edu-slide-art {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0.75rem; display: flex; align-items: center; justify-content: center; height: 155px;
    }
    .edu-slide-art svg { max-width: 100%; height: auto; }
    .edu-slide-body { padding: 0.9rem; }
    .edu-slide-body h4 { margin-bottom: 0.3rem; font-size: 0.95rem; }
    .edu-slide-body p { margin: 0; font-size: 0.84rem; }

    .dir-card {
      flex: 0 0 min(315px, 86vw); scroll-snap-align: start;
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 1rem; box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
      justify-content: space-between; gap: 0.75rem; transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .dir-card:hover, .edu-slide:hover, .hover-lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .dir-modal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.85rem; }
    .dir-modal-grid .dir-card { flex: none; width: 100%; }
    .dir-meta { font-size: 0.83rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 0.25rem; }
    .dir-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.35rem 0; }
    .dir-tag { font-size: 0.74rem; background: var(--surface-alt); color: var(--primary); padding: 0.18rem 0.5rem; border-radius: 999px; font-weight: 600; }

    /* Growth: Locality Hub Badges & Shareable Cards */
    .locality-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
    .locality-chip {
      background: #fff; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem; display: flex; flex-direction: column; gap: 0.2rem; cursor: pointer; transition: all 0.15s;
    }
    .locality-chip:hover { border-color: var(--accent); background: var(--accent-light); }

    /* Tracker Stepper UI */
    .tracker-stepper { display: flex; flex-direction: column; gap: 1rem; margin: 1rem 0; position: relative; }
    .tracker-step { display: flex; gap: 1rem; align-items: flex-start; position: relative; }
    .tracker-step-icon {
      width: 32px; height: 32px; border-radius: 50%; background: var(--surface-alt);
      border: 2px solid var(--border); display: grid; place-items: center; font-weight: 700; font-size: 0.8rem;
      flex-shrink: 0; color: var(--text-muted); z-index: 2;
    }
    .tracker-step.completed .tracker-step-icon { background: var(--success); border-color: var(--success); color: #fff; }
    .tracker-step.current .tracker-step-icon { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tracker-step-content { flex: 1; padding-top: 0.2rem; }
    .tracker-step-content b { display: block; font-size: 0.92rem; color: var(--primary); }
    .tracker-step-content span { font-size: 0.8rem; color: var(--text-muted); }

    /* Reviews Stars */
    .star-rating { color: #f59e0b; font-size: 1rem; display: inline-flex; gap: 2px; }

    /* Sticky Mobile CTA Bar with Safe-Area */
    .mobile-cta-bar {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
      background: #fff; border-top: 1px solid var(--border);
      padding: 0.6rem 0.85rem;
      padding-bottom: calc(0.6rem + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -4px 14px rgba(15,23,42,0.1); gap: 0.5rem;
    }
    body.has-mobile-bar { padding-bottom: calc(65px + env(safe-area-inset-bottom, 0px)); }

    /* Portals & Admin Layout */
    .portal-shell { display: flex; min-height: calc(100vh - 64px); background: var(--surface); }
    .sidebar {
      width: 252px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
      padding: 1rem 0.75rem; display: flex; flex-direction: column; gap: 0.25rem;
    }
    .sidebar-group { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); padding: 0.75rem 0.65rem 0.3rem; letter-spacing: 0.04em; }
    .side-btn {
      width: 100%; text-align: left; background: none; border: none; border-radius: 7px;
      min-height: 38px; padding: 0.52rem 0.75rem; font-size: 0.88rem; font-weight: 500; color: var(--text-muted);
      cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-family: inherit;
    }
    .side-btn:hover { background: var(--surface); color: var(--primary); }
    .side-btn.active { background: var(--accent-light); color: var(--primary); font-weight: 700; }
    .main-area { flex: 1; min-width: 0; padding: 1.5rem; }
    .topbar-portal {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.8rem; margin-bottom: 1.25rem; padding-bottom: 0.85rem; border-bottom: 1px solid var(--border);
    }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
    .kpi-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem 0.95rem; border-top: 3px solid var(--primary); }
    .kpi-label { font-size: 0.74rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .kpi-val { font-size: 1.35rem; font-weight: 800; color: var(--primary); margin: 0.2rem 0; font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: 0.76rem; color: var(--text-muted); }

    .gate-banner {
      background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--accent);
      border-radius: var(--radius); padding: 0.9rem 1.1rem; margin-bottom: 1.15rem; font-size: 0.88rem;
    }

    /* Tables */
    .table-toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
    .table-wrap {
      width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 580px; }
    th {
      background: var(--surface); text-align: left; padding: 0.65rem 0.8rem; font-weight: 600;
      color: var(--primary); border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer;
    }
    td { padding: 0.65rem 0.8rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fcfdff; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 0.75rem; font-size: 0.84rem; color: var(--text-muted); flex-wrap: wrap; gap: 0.5rem; }

    /* Modals & Toasts */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 0.75rem;
    }
    .modal-box {
      background: #fff; border-radius: 12px; width: 100%; max-width: 780px; max-height: 90vh;
      display: flex; flex-direction: column; box-shadow: var(--shadow-md); overflow: hidden;
    }
    .modal-head {
      padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    }
    .modal-body { padding: 1.1rem; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .modal-foot { padding: 0.75rem 1.1rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.5rem; background: var(--surface); }

    #toast-container {
      position: fixed; top: 1rem; right: 1rem; z-index: 200;
      display: flex; flex-direction: column; gap: 0.5rem; max-width: calc(100vw - 2rem);
    }
    .toast {
      background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--primary);
      padding: 0.75rem 0.95rem; border-radius: 8px; box-shadow: var(--shadow-md); font-size: 0.86rem;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    
    .loader-overlay {
      position: fixed; inset: 0; background: rgba(255,255,255,0.72); z-index: 150;
      display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--primary);
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 0.6rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.88rem; }

    /* Responsive */
    @media (max-width: 960px) {
      .hero-grid, .footer-grid { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; left: -270px; top: 64px; bottom: 0; z-index: 50; transition: left 0.22s ease;
        box-shadow: var(--shadow-md); overflow-y: auto; width: 260px;
      }
      .sidebar.open { left: 0; }
    }
    @media (max-width: 768px) {
      input, select, textarea { font-size: 16px; }
    }
    @media (max-width: 720px) {
      .nav-links { display: none; }
      .mobile-menu-btn { display: inline-flex; }
      .nav-actions #nav-login-btn { display: none; }
      .form-grid, .grid-2, .grid-4, .dir-modal-grid { grid-template-columns: 1fr; }
      .quick-check-row { grid-template-columns: 1fr; }
      .main-area { padding: 1rem 0.75rem; }
      .modal-backdrop { padding: 0.5rem; }
      .modal-box { max-height: 94vh; }
      .edu-slide { flex: 0 0 84vw; }
      .dir-card { flex: 0 0 86vw; }
      .table-toolbar { flex-direction: column; align-items: stretch; gap: 0.5rem; }
      .table-toolbar > div { width: 100%; }
      .table-toolbar input[type="search"] { width: 100% !important; }
      .mobile-cta-bar.visible-mobile { display: flex; }
      .site-footer { padding-bottom: 4.5rem; }
    }
    @media (max-width: 480px) {
      .hero { padding: 2rem 0 1.5rem; }
      .hero h1 { font-size: 1.65rem; }
      .hero-ctas .btn { width: 100%; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .kpi-val { font-size: 1.25rem; }
      .footer-bottom { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div id="loader" class="loader-overlay hidden"><div class="spinner"></div><span>Processing...</span></div>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container nav-bar">
      <div class="brand" onclick="App.navigate('#/')">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  function getShareBaseUrl() {

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function inr(n) {
    return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });

  function waLink(phone, msg) {
    const d = String(phone || '').replace(/\D/g, '');
    if (d.length < 10) return '';
    const num = d.length === 10 ? '91' + d : d;
    return 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg || '');
  }

  function parseArr(v) {
    if (Array.isArray(v)) return v;
    if (!v) return [];
    try { const p = JSON.parse(v); return Array.isArray(p) ? p : [String(v)]; } catch (e) { return String(v).split(',').map(s => s.trim()).filter(Boolean); }
  }

  function statusBadge(status) {
    const s = String(status || '').toUpperCase();

  function renderRatingStars(avg, count) {
    const num = Math.round(Number(avg || 5));
    let stars = '';

      stars += i < num ? '★' : '☆';

  function toast(msg, type) {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');

    el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 4500);
  }

  function setLoading(flag) {
    document.getElementById('loader').classList.toggle('hidden', !flag);
  }

  async function apiCall(action, payload, opts) {
    const options = opts || {};
    if (!state.apiUrl) {
      if (!options.suppressErrorToast) toast('Service endpoint is not configured. Please contact support.', 'error');
      throw new Error('Backend API URL is not configured.');
    }
    if (!options.silent) setLoading(true);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 35000);
    const bodyStr = JSON.stringify({
      action: action,
      sessionToken: state.session ? state.session.sessionToken : '',
      payload: payload || {}
    });

    try {
      let res;
      try {
        res = await fetch(state.apiUrl, {
          method: 'POST', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: bodyStr, signal: controller.signal
        });
      } catch (netErr) {
        if (options.allowRetry) {
          res = await fetch(state.apiUrl, {
            method: 'POST', redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: bodyStr
          });
        } else { throw netErr; }
      }
      const json = await res.json();
      if (!json.ok) {
        if (json.code === 'UNAUTHORIZED') {
          state.session = null;
          sessionStorage.removeItem(window.TUTORSYNC_CONFIG.STORAGE_SESSION_KEY);
          updateNav();
          navigate('#/login');
        }
        throw new Error(json.message || 'Server request failed.');
      }
      return json.data;
    } catch (err) {
      const msg = err.name === 'AbortError' ? 'Request timed out. Please retry.' : (err.message || 'Network error.');
      if (!options.suppressErrorToast) toast(msg, 'error');
      throw err;
    } finally {
      clearTimeout(timer);
      if (!options.silent) setLoading(false);
    }
  }

  }

    document.getElementById('modal-backdrop').classList.add('hidden');

    if (!state.apiUrl) {
      if (track) track.innerHTML = '<div class="card" style="width:100%">Directory unavailable: API URL not set.</div>';
      return state.publicDirectory;

    if (state.publicDirectory.loaded && !force) return state.publicDirectory;
    try {

      renderRequirementCardPage(h.replace('#/need-card/', ''));

      renderLocalityHubPage();

      renderStudentRegistration();

      renderTutorRegistration();

      renderTutorPortal();

      renderAdminShell();

  async function handleDeepLink(qs) {
    const params = new URLSearchParams(qs);
    const needRef = params.get('need');
    const tutorRef = params.get('tutor');
    const refCode = params.get('ref');
    const utmSrc = params.get('utm_source');

    if (refCode) {
      state.referralCode = refCode;
      localStorage.setItem('tutorsync_ref', refCode);
      toast('Referral applied: ' + refCode, 'success');
    }
    if (utmSrc) {
      localStorage.setItem('tutorsync_utm_source', utmSrc);
    }
    if (needRef) navigate('#/need-card/' + needRef);
    if (tutorRef) navigate('#/tutor-profile/' + tutorRef);
  }

  async function filterLocalityHub() {
    const loc = document.getElementById('hub-loc').value;
    const sub = document.getElementById('hub-sub').value;
    const brd = document.getElementById('hub-brd').value;
    const res = await apiCall('publicGetLocalityDirectory', { locality: loc, subject: sub, board: brd });
    renderLocalityHubCards(res.filteredTutors, res.filteredStudents);
  }

  function renderLocalityHubCards(tutors, students) {
    const wrap = document.getElementById('hub-results-wrap');

    wrap.innerHTML = `
      <h3 style="margin-bottom:0.75rem">Verified Tutors Available (${tutors.length})</h3>

  function filterDirectoryItems(tab, query, mode) {
    const q = (query || '').toLowerCase().trim();
    const m = (mode || '').toUpperCase();
    const list = tab === 'tutors' ? state.publicDirectory.tutors : state.publicDirectory.students;
    return list.filter(item => {
      if (m && String(item.teachingMode).toUpperCase() !== m) return false;
      if (!q) return true;
      const hay = [
        item.refCode, item.qualifications, item.classGrade, item.board,
        item.generalArea, item.shortBio, item.teachingMode,
        (item.subjects || []).join(' '), (item.classesGrades || []).join(' '), (item.boardExpertise || []).join(' ')
      ].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function renderDirectoryStrip() {
    const track = document.getElementById('dir-scroll-track');
    if (!track) return;
    const bt = document.getElementById('dir-tab-tutors');
    const bs = document.getElementById('dir-tab-students');
    if (bt && state.publicDirectory.loaded) bt.textContent = 'Verified Tutors (' + state.publicDirectory.tutors.length + ')';
    if (bs && state.publicDirectory.loaded) bs.textContent = 'Students Seeking Tutors (' + state.publicDirectory.students.length + ')';
    const filtered = filterDirectoryItems(state.dirTab, state.dirQuery, state.dirMode);
    if (!state.publicDirectory.loaded) {
      track.innerHTML = `<div class="card" style="width:100%"><p style="margin:0">Loading directory...</p></div>`;
      return;
    }
    if (filtered.length === 0) {
      track.innerHTML = `<div class="card" style="width:100%;text-align:center">
        <p style="margin-bottom:0.6rem">No listings match your criteria.</p>
        <button class="btn btn-primary btn-sm" onclick="App.navigate('${state.dirTab==='tutors'?'#/register-student':'#/register-tutor'}')">${state.dirTab==='tutors'?'Post Requirement Free':'Register as Tutor'}</button>
      </div>`;
      return;
    }
    track.innerHTML = filtered.slice(0, 15).map(it => renderDirCardHtml(it, state.dirTab)).join('');
  }

  function applyQuickFilter(tag, btnEl) {
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));

    if (tag === 'All') { state.dirQuery = ''; state.dirMode = ''; }
    else if (tag === 'Online' || tag === 'Offline') { state.dirMode = tag.toUpperCase(); state.dirQuery = ''; }

  async function submitStudentReg(e) {
    e.preventDefault();
    const subs = getCheckedValues('sr-sub');
    const days = getCheckedValues('sr-days');
    if (subs.length === 0) return toast('Please select at least one subject.', 'error');
    if (days.length === 0) return toast('Please select preferred tuition days.', 'error');
    try {
      const res = await apiCall('publicRegisterStudent', {
        websiteTrap: document.getElementById('sr-trap').value,
        name: document.getElementById('sr-name').value,
        email: document.getElementById('sr-email').value,
        phone: document.getElementById('sr-phone').value,
        whatsapp: document.getElementById('sr-wa').value,
        classGrade: document.getElementById('sr-class').value,
        board: document.getElementById('sr-board').value,
        boardOther: document.getElementById('sr-board-other').value,

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function submitTutorReg(e) {
    e.preventDefault();
    const subs = getCheckedValues('tr-sub'), cls = getCheckedValues('tr-cls'), brds = getCheckedValues('tr-brd'), days = getCheckedValues('tr-days');
    if (!subs.length || !cls.length || !brds.length || !days.length) return toast('Please select subjects, classes, boards, and days.', 'error');
    const fileInput = document.getElementById('tr-doc-file');
    let docB64 = '', docName = '', docMime = '';
    if (fileInput.files && fileInput.files[0]) {
      const f = fileInput.files[0];
      if (f.size > 1550000) return toast('File size must be under 1.5 MB.', 'error');
      docB64 = await readFileAsBase64(f); docName = f.name; docMime = f.type;
    }
    try {
      const res = await apiCall('publicRegisterTutor', {
        websiteTrap: document.getElementById('tr-trap').value,
        fullName: document.getElementById('tr-name').value, email: document.getElementById('tr-email').value,
        phone: document.getElementById('tr-phone').value, whatsapp: document.getElementById('tr-wa').value,

  function switchAuthMode(mode) {
    document.getElementById('auth-mode').value = mode;
    document.getElementById('tab-pass').className = 'btn btn-sm ' + (mode === 'password' ? 'btn-primary' : 'btn-outline');
    document.getElementById('tab-otp').className = 'btn btn-sm ' + (mode === 'otp' ? 'btn-primary' : 'btn-outline');
    document.getElementById('tab-act').className = 'btn btn-sm ' + (mode === 'activate' ? 'btn-primary' : 'btn-outline');
    document.getElementById('auth-pass-wrap').classList.toggle('hidden', mode !== 'password');
    document.getElementById('auth-otp-wrap').classList.toggle('hidden', mode === 'password');
    document.getElementById('auth-newpass-wrap').classList.toggle('hidden', mode !== 'activate');

  async function requestLoginOtp() {
    const email = document.getElementById('auth-email').value.trim();
    if (!email) return toast('Enter registered email first.', 'error');
    try { const res = await apiCall('authRequestOtp', { email }); toast(res.message || 'Code sent.', 'success'); } catch (e) {}
  }

  async function submitAuth(e) {
    e.preventDefault();
    const mode = document.getElementById('auth-mode').value;
    const email = document.getElementById('auth-email').value.trim();
    try {
      let data;
      if (mode === 'activate') {
        data = await apiCall('authActivateAccount', { email, otp: document.getElementById('auth-otp').value.trim(), newPassword: document.getElementById('auth-newpass').value });
      } else {
        data = await apiCall('authLogin', { email, password: mode === 'password' ? document.getElementById('auth-pass').value : '', otp: mode === 'otp' ? document.getElementById('auth-otp').value.trim() : '' });
      }
      state.session = data;
      sessionStorage.setItem(window.TUTORSYNC_CONFIG.STORAGE_SESSION_KEY, JSON.stringify(data));
      updateNav();
      toast('Signed in as ' + data.user.role, 'success');
      goToMyPortal();
    } catch (err) {}
  }

  async function loadAdminModule(modId) {
    state.adminModule = modId;
    const sb = document.getElementById('admin-sidebar');
    if (sb) {
      sb.classList.remove('open');
      sb.querySelectorAll('.side-btn').forEach(b => b.classList.toggle('active', b.getAttribute('onclick').indexOf("'" + modId + "'") !== -1));
    }
    const container = document.getElementById('admin-main');
    if (!container) return;

    try {
      if (modId === 'growth') await renderAdminGrowthEngine(container);
      else if (modId === 'gates') await renderAdminCriticalGates(container);
      else if (modId === 'dashboard') await renderAdminDashboard(container);
      else if (modId === 'verification') await renderAdminVerification(container);
      else if (modId === 'students') await renderAdminStudents(container);
      else if (modId === 'tutors') await renderAdminTutors(container);
      else if (modId === 'matching') await renderAdminMatching(container);
      else if (modId === 'assignments') await renderAdminAssignments(container);
      else if (modId === 'sessions') await renderAdminSessions(container);
      else if (modId === 'invoices') await renderAdminInvoices(container);
      else if (modId === 'payments') await renderAdminPayments(container);
      else if (modId === 'ledger') await renderAdminLedger(container);
      else if (modId === 'commissions') await renderAdminCommissions(container);
      else if (modId === 'payouts') await renderAdminPayouts(container);
      else if (modId === 'notifications') await renderAdminNotificationsAndTickets(container);
      else if (modId === 'reports') renderAdminReports(container);
      else if (modId === 'settings') await renderAdminSettings(container);
      else if (modId === 'audit') await renderAdminAudit(container);

  async function reviewPaymentClaim(claimId, approve) {
    let reviewNotes = '';
    if (!approve) {
      reviewNotes = prompt('Enter rejection reason:');
      if (!reviewNotes) return toast('Reason required.', 'error');
    } else if (!confirm('Confirm you verified this payment credit in your bank/UPI app?')) return;
    try {
      await apiCall('adminReviewPaymentClaim', { claimId, approve, reviewNotes });
      toast(approve ? 'Payment reconciled and ledger accrued.' : 'Claim rejected.', 'success');
      loadAdminModule(state.adminModule);
    } catch (e) {}
  }

  async function verifyEntity(sheet, entityId, status) {
    const notes = prompt(status === 'REJECTED' ? 'Enter rejection reason:' : 'Verification notes:');
    if (status === 'REJECTED' && !notes) return toast('Rejection reason required.', 'error');
    if (notes === null) return;
    try {
      await apiCall(sheet === 'Students' ? 'adminVerifyStudent' : 'adminVerifyTutor', { entityId, status, notes });
      toast(entityId + ' marked ' + status, 'success');
      state.publicDirectory.loaded = false;
      loadAdminModule(state.adminModule);
    } catch (e) {}
  }

    try {

      const wrap = document.getElementById('match-results');
      wrap.innerHTML = `<p class="help-text">${esc(res.disclaimer)}</p>` + (res.candidates.length ? `
        <div class="table-wrap"><table><thead><tr><th>Score</th><th>Tutor</th><th>Compatibility</th><th>Fee vs Budget</th><th>Status</th><th>Actions</th></tr></thead><tbody>
          ${res.candidates.map(c => `<tr>
            <td><div class="score-bar"><div class="score-fill" style="width:${c.matchScore}%"></div></div><b>${c.matchScore}</b></td>
            <td><b>${esc(c.fullName)}</b> (${esc(c.tutorId)})<br><span class="help-text">${esc(c.phone)}</span></td>
            <td style="font-size:0.8rem">${esc(c.explanation)}</td>
            <td>${inr(c.expectedMonthlyFee)} vs ${inr(res.student.BudgetPerMonth)}</td>

            <td style="white-space:nowrap">
              <button class="btn btn-outline btn-sm" onclick="App.saveMatch('${esc(studentId)}','${esc(c.tutorId)}','SHORTLISTED')">Shortlist</button>
              <button class="btn btn-accent btn-sm" onclick="App.openAssignmentModal('${esc(studentId)}','${esc(c.tutorId)}','${esc(c.matchId)}')">Assign</button>
              <a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="${waLink(c.whatsapp||c.phone, 'Hello ' + c.fullName + ', TutorSync has an opening for ' + res.student.ClassGrade + ' (' + studentId + '). Interested?')}">WA</a>

      document.getElementById('rep-output').innerHTML = `

  function exportCurrentReportCsv() {
    if (!state.currentReport) return toast('Generate a report first.', 'error');
    exportToCsv(state.currentReport.title.replace(/\s+/g,'_') + '.csv', state.currentReport.headers, state.currentReport.rows);
  }

  function exportToCsv(filename, headers, rows) {
    const csvCell = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
    const lines = [headers.map(csvCell).join(',')].concat(rows.map(r => r.map(csvCell).join(',')));
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }
